name: Prek checks
on:
  pull_request:
  merge_group:
jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: corretto
          java-version: "25"
      - uses: sigoden/install-binary@v1.3.0
        with:
          repo: terraform-docs/terraform-docs
      - name: "Install yq"
        run: |
          # Download newer version of yq because the one in the Ubuntu repo is too old
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
      - run: |
          sudo apt-get update
          sudo apt-get install libxml2-utils
          ./hooks/install-java-format.sh
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: taplo
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: fd-find
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: just
      - uses: opentofu/setup-opentofu@v2.0.2
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
      - name: "Create the workspace virtual environment"
        run: uv sync --frozen
      - id: changed-files
        uses: tj-actions/changed-files@v47.0.6
      - uses: j178/prek-action@v3.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          extra-args: --files ${{ steps.changed-files.outputs.all_changed_files }}
      - name: "Run tests for workspace members with changes"
        run: ./ops/utils/scripts/run-member-tests.sh ${{ steps.changed-files.outputs.all_changed_files }}
