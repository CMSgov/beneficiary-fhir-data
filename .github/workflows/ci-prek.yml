name: Prek checks
on:
  pull_request:
  merge_group:
jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: "25"
      - uses: sigoden/install-binary@bea43f0d6192f38559f1850838d1fd7801f546d7 #v1.3.0
        with:
          repo: terraform-docs/terraform-docs
      - name: "Install yq"
        run: |
          # Download newer version of yq because the one in the Ubuntu repo is too old
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
      - run: |
          sudo apt-get update
          sudo apt-get install libxml2-utils
          ./hooks/install-java-format.sh
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: taplo
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      - id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          extra-args: --files ${{ steps.changed-files.outputs.all_changed_files }}
