name: Update Code.json
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-code-json:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.23.4"

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.10"

      - name: Install SCC
        run: go install github.com/boyter/scc/v3@v3.7.0

      - name: "Generate an App Token"
        id: generate_token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.BFD_RELEASE_APP_ID }}
          private-key: ${{ secrets.BFD_RELEASE_APP_KEY }}

      - name: Update code.json
        uses: DSACMS/automated-codejson-generator@v2.0.0
        with:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          BRANCH: "master"
