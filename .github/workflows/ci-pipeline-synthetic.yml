name: CI - Synthetic Pipeline

on:
  pull_request:
    paths:
      - "apps/bfd-model-idr/**"
      - "apps/bfd-pipeline-idr/**"
      - ".github/workflows/ci-pipeline-synthetic.yml"
  merge_group:

jobs:
  run-synthetic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        id: code-checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - name: Install node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.23.4"
      # Maven is needed to run the migrator
      - name: "Setup JDK"
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "25"
          distribution: "corretto"
      - uses: taiki-e/install-action@v2.87.31
        with:
          tool: just
      - uses: sigoden/install-binary@v1.3.0
        with:
          repo: sigoden/argc
      - name: Generate v3 Data Dictionary
        run: just generate-data-dictionary
      - name: Ensure synthetic data pipeline runs
        run: |
          just patient-generator --patients 100
          just claims-generator ./apps/bfd-model-idr/out
          just pipeline --env local --seed-from ./apps/bfd-model-idr/out
