name: CI - Synthetic Pipeline

on:
  pull_request:
    paths:
      - "apps/bfd-model-idr/**"
      - "apps/bfd-pipeline-idr/**"
      - ".github/workflows/ci-pipeline-synthetic.yml"
  merge_group:

jobs:
  run-synthetic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        id: code-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.2"
      - name: Install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Maven is needed to run the migrator
      - name: "Setup JDK"
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "25"
          distribution: "corretto"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just
      - uses: sigoden/install-binary@bea43f0d6192f38559f1850838d1fd7801f546d7 #v1.3.0
        with:
          repo: sigoden/argc
      - name: Generate v3 Data Dictionary
        run: just generate-data-dictionary
      - name: Ensure synthetic data pipeline runs
        run: |
          just patient-generator --patients 100
          just claims-generator ./apps/bfd-model-idr/out
          just pipeline --env local --seed-from ./apps/bfd-model-idr/out
