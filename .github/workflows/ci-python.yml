name: CI - Python

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/*requirement*.txt"
      - "**/uv.lock"
      - ".github/workflows/ci-python.yml"

  merge_group:

env:
  BASE_COMMIT: ""
  GH_TOKEN: ${{ github.token }}

jobs:
  matrix-pytest:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        projects: [
            {
              projectName: "locust",
              projectRoot: "apps/utils/locust_tests",
              testsRoot: "apps/utils/locust_tests",
              uvCommand: "uv sync --group lambda-run-locust",
              # no tests
              pytestCommand: "echo 'no tests'",
              pythonVersion: "3.13",
            },
            {
              projectName: "idr-pipeline",
              projectRoot: "apps/bfd-pipeline-idr",
              testsRoot: "apps/bfd-pipeline-idr",
              uvCommand: "uv sync",
              pytestCommand: "uv run pytest",
              pythonVersion: "3.14",
            },
            {
              projectName: "run-idr-pipeline",
              projectRoot: "ops/services/04-idr-pipeline/lambda_src/run-idr-pipeline",
              testsRoot: "ops/services/04-idr-pipeline/lambda_src/run-idr-pipeline",
              uvCommand: "uv sync",
              pytestCommand: "uv run pytest",
              pythonVersion: "3.14",
            },
            {
              projectName: "run-idr-model-generate-bene-sample",
              projectRoot: "apps/bfd-model-idr/src/generate_bene_sample",
              testsRoot: "apps/bfd-model-idr/src/generate_bene_sample",
              uvCommand: "uv sync",
              pytestCommand: "uv run pytest",
              pythonVersion: "3.14",
            },
            {
              projectName: "run-idr-model-generate-eob-sample",
              projectRoot: "apps/bfd-model-idr/src/generate_eob_sample",
              testsRoot: "apps/bfd-model-idr/src/generate_eob_sample",
              uvCommand: "uv sync",
              pytestCommand: "uv run pytest",
              pythonVersion: "3.14",
            },
            {
              projectName: "run-idr-model-gen-dd",
              projectRoot: "apps/bfd-model-idr/src/gen_dd",
              testsRoot: "apps/bfd-model-idr/src/gen_dd",
              uvCommand: "uv sync",
              pytestCommand: "uv run pytest",
              pythonVersion: "3.14",
            },
            {
              projectName: "run-idr-model-generate-prior-auth-sample",
              projectRoot: "apps/bfd-model-idr/src/generate_prior_auth_sample",
              testsRoot: "apps/bfd-model-idr/src/generate_prior_auth_sample",
              uvCommand: "uv sync",
              pytestCommand: "uv run pytest",
              pythonVersion: "3.14",
            },
            {
              projectName: "run-idr-model-generate-coverage-sample",
              projectRoot: "apps/bfd-model-idr/src/generate_coverage_sample",
              testsRoot: "apps/bfd-model-idr/src/generate_coverage_sample",
              uvCommand: "uv sync",
              pytestCommand: "uv run pytest",
              pythonVersion: "3.14",
            },
          ]
      fail-fast: false
    steps:
      - name: Checkout code
        id: code-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
      # Maven is needed to run the migrator
      - name: "Setup JDK"
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "25"
          distribution: "corretto"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - name: Run Python Tests per project
        id: run-pytest-set
        run: |
          echo "Testing ${{ matrix.projects.projectName }}"
          cd ${{ github.workspace }}/${{ matrix.projects.projectRoot }}
          uv python install
          ${{ matrix.projects.uvCommand }}
          # check linting
          uv run ruff check
          # check formatting
          uv run ruff format --check
          # check types
          uv run pyright .
          # tests
          ${{ matrix.projects.pytestCommand }} ${{ github.workspace }}/${{ matrix.projects.testsRoot }}
