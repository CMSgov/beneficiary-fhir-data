# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer", exclude = "\\.snap" },
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "fix-byte-order-marker" },
  # Normalize line endings to LF
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-symlinks" },
  { id = "destroyed-symlinks" },
  { id = "check-merge-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-executables-have-shebangs" },
]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1-1"
hooks = [{ id = "shellcheck", args = ["--severity=warning"] }]

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.14.1-1"
hooks = [{ id = "shfmt" }]

[[repos]]
repo = "https://github.com/tofuutils/pre-commit-opentofu"
rev = "v2.4.2"
hooks = [{ id = "tofu_fmt" }, { id = "tofu_docs" }]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [{ id = "gitleaks" }]

[[repos]]
repo = "https://github.com/deadnews/pindock"
rev = "v1.1.3"
hooks = [{ id = "pindock-check", name = "Dockerfile images are digest-pinned" }]

# We can use post-checkout and post-merge to run settings sync operations
# post-merge also runs on pull
[[repos]]
repo = "local"
[[repos.hooks]]
id = "merge-vscode-settings"
name = "merge VS Code settings with workspace defaults"
language = "system"
stages = ["post-checkout", "post-merge"]
always_run = true
pass_filenames = false
entry = "./hooks/merge_vscode_settings.py"

[[repos]]
repo = "local"
[[repos.hooks]]
id = "install-vscode-extensions"
name = "install recommended VS Code extensions if missing"
language = "system"
stages = ["post-checkout", "post-merge"]
always_run = true
pass_filenames = false
entry = "./hooks/install-recommended-extensions.sh"

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.8"
hooks = [
  { id = "ruff-check", args = [
    "--fix",
  ], types_or = [
    "python",
    "pyi",
  ], exclude = "^(docs|insights|ops/utils/synthetic-data|ops/services/06-server-alarms/docs|apps/utils/scripts|apps/bfd-model/bfd-model-rif/src/main/resources/db/scripts)/" },

  { id = "ruff-format", types = [
    "python",
  ], exclude = "^(docs|insights|ops/utils/synthetic-data|ops/services/06-server-alarms/docs|apps/utils/scripts|apps/bfd-model/bfd-model-rif/src/main/resources/db/scripts)/" },
]

[[repos]]
repo = "local"
[[repos.hooks]]
id = "basedpyright"
name = "basedpyright"
language = "system"
types_or = ["python", "pyi"]
entry = "uv run basedpyright"
exclude = "^(docs|insights|ops/utils/synthetic-data|ops/services/06-server-alarms/docs|apps/utils/scripts|apps/bfd-model/bfd-model-rif/src/main/resources/db/scripts)/"

[[repos]]
repo = "local"
# uv prefers already-locked versions. This hook adds new dependencies to the lockfile without
# changing versions that are already pinned.
# Upgrading a pinned version stays an explicit `uv lock --upgrade`.
[[repos.hooks]]
id = "uv-lock"
name = "uv lockfile is regenerated"
language = "system"
files = "pyproject\\.toml$|uv\\.lock$"
entry = "uv lock"
pass_filenames = false

[[repos]]
repo = "local"
[[repos.hooks]]
id = "pytest-model-idr"
name = "IDR model tests"
language = "system"
files = "^apps/bfd-model-idr/.*\\.py$"
entry = "uv run pytest apps/bfd-model-idr/src"
pass_filenames = false

[[repos]]
repo = "local"
[[repos.hooks]]
id = "pytest-idr-pipeline"
name = "IDR pipeline tests"
language = "system"
files = "^apps/bfd-pipeline-idr/.*\\.py$"
entry = "uv run pytest apps/bfd-pipeline-idr/test"
pass_filenames = false

[[repos]]
repo = "local"
[[repos.hooks]]
id = "pytest-run-idr-pipeline"
name = "run-idr-pipeline tests"
language = "system"
files = "^ops/services/04-idr-pipeline/lambda_src/run-idr-pipeline/.*\\.py$"
entry = "uv run pytest ops/services/04-idr-pipeline/lambda_src/run-idr-pipeline/tests"
pass_filenames = false

[[repos]]
repo = "local"
[[repos.hooks]]
id = "git-hook-shims-fresh"
name = "git hook shims match the scripts in hooks/"
language = "system"
always_run = true
pass_filenames = false
entry = "./hooks/refresh-hook-shims.sh"

[[repos]]
repo = "local"
[[repos.hooks]]
id = "actions-lock"
name = "Workflow actions are locked"
language = "system"
files = "\\.github/(workflows|actions)/.*(\\.ya?ml|.lock)$"
entry = "./hooks/actions-lock.sh"
pass_filenames = false
include_deleted = true

[[repos]]
repo = "local"
[[repos.hooks]]
id = "java"
name = "java"
language = "system"
types = ["java"]
entry = "./hooks/java-format.sh"

[[repos]]
repo = "local"
[[repos.hooks]]
id = "sops"
name = "sops"
language = "system"
files = "\\.sopsw\\.yaml$"
entry = "./hooks/sops.sh"

[[repos]]
repo = "local"
[[repos.hooks]]
id = "toml"
name = "toml"
language = "system"
types = ["toml"]
entry = "taplo format"

# xmllint can only process one file at a time
[[repos]]
repo = "local"
[[repos.hooks]]
id = "xml"
name = "xml"
language = "system"
types = ["xml"]
entry = "./hooks/xml-format.sh"
pass_filenames = 1

[[repos]]
repo = "local"
[[repos.hooks]]
id = "just"
name = "just"
language = "system"
files = "Justfile"
entry = "just --fmt"
pass_filenames = false

[[repos]]
repo = "local"
[[repos.hooks]]
id = "prettier"
name = "prettier"
entry = "prettier"
args = ["--check", "--write", "--ignore-unknown"]
language = "node"
types = ["yaml", "json"]
additional_dependencies = ["prettier"]
