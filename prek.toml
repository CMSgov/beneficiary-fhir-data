# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer", exclude = "\\.snap" },
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "fix-byte-order-marker" },
  # Normalize line endings to LF
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-symlinks" },
  { id = "destroyed-symlinks" },
  { id = "check-merge-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-executables-have-shebangs" },
]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1-1"
hooks = [{ id = "shellcheck", args = ["--severity=warning"] }]

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.14.1-1"
hooks = [{ id = "shfmt" }]

[[repos]]
repo = "https://github.com/tofuutils/pre-commit-opentofu"
rev = "v2.4.2"
hooks = [{ id = "tofu_fmt" }, { id = "tofu_docs" }]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.24.2"
hooks = [{ id = "gitleaks" }]

[[repos]]
repo = "https://github.com/deadnews/pindock"
rev = "v1.1.3"
hooks = [{ id = "pindock-check", name = "Dockerfile images are digest-pinned" }]

[[repos]]
repo = "local"
[[repos.hooks]]
id = "actions-lock"
name = "Workflow actions are locked"
language = "system"
files = "\\.github/(workflows|actions)/.*(\\.ya?ml|.lock)$"
entry = "./hooks/verify-actions-lock.sh"
pass_filenames = false

[[repos]]
repo = "local"
[[repos.hooks]]
id = "java"
name = "java"
language = "system"
types = ["java"]
entry = "./hooks/java-format.sh"

[[repos]]
repo = "local"
[[repos.hooks]]
id = "sops"
name = "sops"
language = "system"
files = "\\.sopsw\\.yaml$"
entry = "./hooks/sops.sh"

[[repos]]
repo = "local"
[[repos.hooks]]
id = "toml"
name = "toml"
language = "system"
types = ["toml"]
entry = "taplo format"

# xmllint can only process one file at a time
[[repos]]
repo = "local"
[[repos.hooks]]
id = "xml"
name = "xml"
language = "system"
types = ["xml"]
entry = "./hooks/xml-format.sh"
pass_filenames = 1

[[repos]]
repo = "local"
[[repos.hooks]]
id = "prettier"
name = "prettier"
entry = "prettier"
args = ["--check", "--write", "--ignore-unknown"]
language = "node"
types = ["yaml"]
additional_dependencies = ["prettier"]
