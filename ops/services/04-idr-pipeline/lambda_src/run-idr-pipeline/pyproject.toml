[project]
name = "run-idr-pipeline"
version = "0.1.0"
description = "Lambda to consolidate running the IDR Pipeline Task"
readme = "README.md"
requires-python = ">=3.14.3"
dependencies = [
  "boto3>=1.42.80",
  "aws-lambda-powertools>=3.26.0",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.13.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
