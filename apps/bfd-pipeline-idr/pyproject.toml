[project]
name = "idr-pipeline"
version = "0.1.0"
description = "ETL Pipeline to load data from the IDR into BFD's database"
requires-python = ">=3.14.3"
dependencies = [
  "cryptography",
  "psycopg[binary,pool]",
  "snowflake-connector-python",
  "snowflake-snowpark-python",
  "python-dateutil",
  "pydantic",
  "usaddress",
  "unidecode",
  "click",
  "anyio",
  "loguru",
  "tblib",
]

[project.scripts]
idr-pipeline = "idr_pipeline:main"
snowflake-extract = "snowflake_extract:main"

[tool.uv.build-backend]
module-name = ["idr_pipeline", "snowflake_extract"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
