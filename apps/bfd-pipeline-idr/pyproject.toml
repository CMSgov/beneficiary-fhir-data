[project]
name = "idr-pipeline"
version = "0.1.0"
description = "ETL Pipeline to load data from the IDR into BFD's database"
requires-python = ">=3.14.3"
dependencies = [
    "cryptography>=50.0.0",
    "psycopg[binary,pool]>=3.3.3",
    "snowflake-connector-python>=4.7.1",
    "snowflake-snowpark-python>=1.54.0",
    "python-dateutil>=2.9.0",
    "pydantic>=2.13.3",
    "usaddress>=0.5.16",
    "unidecode>=1.4.0",
    "click>=8.4.2",
    "anyio",
    "loguru",
    "tblib>=3.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.14.6",
    "uv>=0.11.15",
    "pytest>=9.0.1",
    "testcontainers>=4.13.3",
    "pyright>=1.1.407",
]

[project.scripts]
idr-pipeline = "idr_pipeline:main"

[build-system]
requires = ["uv_build<=0.12"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.build-backend]
module-name = "idr_pipeline"

[tool.uv.sources]
loguru = { git = "https://github.com/Delgan/loguru", rev = "2a17be730e111cf874d0bf967c4c5da15b7e4670" }

# [[tool.mypy.overrides]]
# module = ["testcontainers.*"]
# follow_untyped_imports = true

[tool.ruff]
# Set the maximum line length to 100.
line-length = 100

[tool.ruff.lint]
select = [
    "D",    # pydocstyle
    "E501",
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    "ANN",
    "LOG",
    "G",
    "PT",
    "RSE",
    "PIE",
    "RET",
    "SLF",
    "ARG",
    "PTH",
    "PLE",
    "PLW",
    "PERF",
    "FURB",
    "RUF",
]
# Don't require docstrings
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
