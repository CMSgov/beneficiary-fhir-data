[project]
name = "synthetic-data-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.3"
dependencies = [
  "faker",
  "pandas",
  "xlsxwriter",
  "pyyaml",
  "pydantic",
  "tqdm",
  "click",
  "requests",
  "snowflake-snowpark-python",
  "prompt-toolkit",
  "cryptography",
]

[project.scripts]
generate-eob-sample = "generate_eob_sample:main"
generate-bene-sample = "generate_bene_sample:main"
gen-dd = "gen_dd:main"
generate-prior-auth-sample = "generate_prior_auth_sample:main"
generate-coverage-sample = "generate_coverage_sample:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = [
  "idr_model",
  "generate_eob_sample",
  "generate_bene_sample",
  "gen_dd",
  "generate_prior_auth_sample",
  "generate_coverage_sample",
]
